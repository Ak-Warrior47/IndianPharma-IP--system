<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | Pharma IP System</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'DM Sans', sans-serif; background: #ffffff; min-height: 100vh;
       display: flex; align-items: center; justify-content: center; }
.card { background: #fff; border-radius: 18px; padding: 36px 40px; width: 100%; max-width: 420px;
        box-shadow: 0 8px 32px rgba(29,78,216,0.12); }
h1 { font-size: 22px; font-weight: 700; color: #0f172a; margin-bottom: 6px; }
p { font-size: 13px; color: #64748b; margin-bottom: 24px; }
.field { margin-bottom: 18px; }
label { display: block; font-size: 12px; font-weight: 700; color: #374151;
        text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
input { width: 100%; padding: 12px 14px; border: 1.5px solid #c7d9f5;
        border-radius: 10px; font-size: 14px; font-family: inherit;
        background: rgba(238,244,255,0.5); color: #0f172a; }
input:focus { outline: none; border-color: #1d4ed8; background: #fff; }
.btn { width: 100%; padding: 13px; background: linear-gradient(135deg,#1d4ed8,#1e3a8a);
       color: #fff; border: none; border-radius: 10px; font-size: 14px; font-weight: 700;
       cursor: pointer; font-family: inherit; margin-top: 4px; }
.btn:hover { opacity: 0.92; }
.alert { padding: 11px 14px; border-radius: 9px; font-size: 13px; margin-bottom: 16px; }
.alert-info { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
.alert-success { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
.alert-warning { background: #fffbeb; color: #d97706; border: 1px solid #fcd34d; }
.alert-danger { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
.back { display: block; text-align: center; margin-top: 18px; font-size: 13px;
        color: #1d4ed8; text-decoration: none; }
.back:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="card">
  <h1>Reset Password</h1>
  <p>Enter the 6-digit OTP sent to your phone, then set a new password.</p>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}{% for cat, msg in messages %}
    <div class="alert alert-{{ cat }}">{{ msg }}</div>
    {% endfor %}{% endif %}
  {% endwith %}

  <form method="POST" action="/reset_password">
    <input type="hidden" name="phone" value="{{ phone | e }}">
    <div class="field">
      <label>OTP Code</label>
      <input type="text" name="otp" maxlength="6" placeholder="6-digit OTP" required autofocus inputmode="numeric">
    </div>
    <div class="field">
      <label>New Password (min 6 chars)</label>
      <input type="password" name="new_password" minlength="6" required>
    </div>
    <div class="field">
      <label>Confirm New Password</label>
      <input type="password" name="confirm_password" minlength="6" required>
    </div>
    <button type="submit" class="btn">Reset Password</button>
  </form>
  <a href="/forgot_password" class="back">← Request new OTP</a>
</div>
</body>
</html>
