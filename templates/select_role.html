<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choose Role | Pharma IP</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  background: linear-gradient(135deg, #060d1f 0%, #0e1f45 55%, #060d1f 100%);
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
}
.card {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px;
  padding: 40px 36px;
  width: 100%; max-width: 460px;
  backdrop-filter: blur(12px);
  box-shadow: 0 24px 64px rgba(0,0,0,0.5);
}
.title {
  font-family: 'DM Serif Display', serif;
  font-size: 26px; color: #fff;
  text-align: center; margin-bottom: 6px;
}
.sub {
  font-size: 13px; color: rgba(255,255,255,0.5);
  text-align: center; margin-bottom: 32px;
}
.roles { display: flex; flex-direction: column; gap: 14px; }
.role-btn {
  display: flex; align-items: center; gap: 16px;
  padding: 18px 22px;
  background: rgba(255,255,255,0.05);
  border: 1.5px solid rgba(255,255,255,0.12);
  border-radius: 14px;
  cursor: pointer;
  transition: background .18s, border-color .18s, transform .15s;
  text-decoration: none;
}
.role-btn:hover {
  background: rgba(29,78,216,0.25);
  border-color: rgba(99,179,237,0.4);
  transform: translateY(-2px);
}
.role-icon { font-size: 32px; line-height: 1; }
.role-info { flex: 1; }
.role-name {
  font-size: 16px; font-weight: 700; color: #fff;
  text-transform: capitalize; margin-bottom: 2px;
}
.role-tag {
  font-size: 11px; font-weight: 600;
  color: rgba(255,255,255,0.45);
  text-transform: uppercase; letter-spacing: .5px;
}
.role-arrow { font-size: 18px; color: rgba(255,255,255,0.3); }
.skip {
  display: block; text-align: center;
  margin-top: 22px; font-size: 12px;
  color: rgba(255,255,255,0.3);
  text-decoration: none;
}
.skip:hover { color: rgba(255,255,255,0.6); }

/* ════════ APPLE-STYLE GLASSMORPHISM OVERLAY ════════ */
:root {
  --glass-bg: rgba(255,255,255,0.55);
  --glass-bg-strong: rgba(255,255,255,0.7);
  --glass-border: rgba(255,255,255,0.45);
  --glass-shadow: 0 8px 32px rgba(31,38,135,0.12);
  --glass-blur: blur(20px) saturate(180%);
  --glass-blur-strong: blur(28px) saturate(200%);
  --bg-blob-1: #a5b4fc;
  --bg-blob-2: #f9a8d4;
  --bg-blob-3: #93c5fd;
  --glass-text: #0f172a;
  --glass-muted: #475569;
}
html, body {
  background: linear-gradient(135deg, #eff6ff 0%, #fdf2f8 50%, #f5f3ff 100%) !important;
  min-height: 100vh;
  color: var(--glass-text);
}
body::before, body::after {
  content: ''; position: fixed; border-radius: 50%;
  filter: blur(90px); opacity: 0.55; pointer-events: none; z-index: -1;
  animation: floatBlob 18s ease-in-out infinite alternate;
}
body::before { width: 480px; height: 480px; background: var(--bg-blob-1); top: -120px; left: -120px; }
body::after  { width: 520px; height: 520px; background: var(--bg-blob-2); bottom: -150px; right: -150px; animation-delay: -8s; }
@keyframes floatBlob { from { transform: translate(0,0) scale(1); } to { transform: translate(60px,80px) scale(1.15); } }

.card, .glass-card, .stat-card, .kpi-card, .sc-card, .panel, .box {
  background: var(--glass-bg) !important;
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
  border: 1px solid var(--glass-border) !important;
  border-radius: 18px !important;
  box-shadow: var(--glass-shadow) !important;
}
input:not([type=checkbox]):not([type=radio]):not([type=submit]):not([type=hidden]),
select, textarea {
  background: rgba(255,255,255,0.65) !important;
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.55) !important;
  border-radius: 12px !important;
  transition: all .2s ease;
}
input:focus, select:focus, textarea:focus {
  outline: none !important;
  background: rgba(255,255,255,0.85) !important;
  border-color: rgba(99,102,241,0.55) !important;
  box-shadow: 0 0 0 4px rgba(165,180,252,0.25) !important;
}
button, .btn, .btn-submit, .btn-sm, .btn-view, .btn-export, .btn-dl, .btn-nav, .btn-back, .btn-fill-past, .role-btn {
  border-radius: 12px !important;
  transition: transform .2s ease, box-shadow .2s ease, background .2s ease !important;
}
button:hover, .btn:hover, .btn-submit:hover, .btn-sm:hover, .btn-view:hover, .btn-export:hover, .btn-dl:hover, .btn-nav:hover, .btn-back:hover, .btn-fill-past:hover, .role-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(99,102,241,0.25) !important;
}
.nav, .navbar, .top-nav, .sidebar, header {
  background: rgba(255,255,255,0.6) !important;
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  backdrop-filter: blur(24px) saturate(180%);
  border-color: var(--glass-border) !important;
}
table {
  border-radius: 14px;
  overflow: hidden;
  background: rgba(255,255,255,0.4);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
}
thead, table thead tr { background: rgba(255,255,255,0.55) !important; }
tbody tr:nth-child(even) { background: rgba(255,255,255,0.25); }
tbody tr:hover { background: rgba(165,180,252,0.18) !important; }
.badge, .chip, .pill, .status-badge {
  border-radius: 999px !important;
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.4) !important;
}
.flash, .alert, .flash-message { 
  background: var(--glass-bg-strong) !important;
  -webkit-backdrop-filter: var(--glass-blur);
  backdrop-filter: var(--glass-blur);
  border: 1px solid var(--glass-border) !important;
  border-radius: 14px !important;
  box-shadow: var(--glass-shadow) !important;
}
/* select_role specific glass tweaks */
.card .title { color: var(--glass-text) !important; }
.card .sub { color: var(--glass-muted) !important; }
.role-btn { background: rgba(255,255,255,0.5) !important; border: 1px solid rgba(255,255,255,0.6) !important; }
.role-btn:hover { background: rgba(165,180,252,0.35) !important; border-color: rgba(99,102,241,0.5) !important; }
.role-name { color: var(--glass-text) !important; }
.role-tag { color: var(--glass-muted) !important; }
.role-arrow { color: var(--glass-muted) !important; }
.skip { color: var(--glass-muted) !important; }
.skip:hover { color: var(--glass-text) !important; }
/* ════════ END GLASSMORPHISM OVERLAY ════════ */

</style>
</head>
<body>
<div class="card">
  <div class="title">Good day, {{ user_name.split()[0] }}!</div>
  <div class="sub">Which role are you working as today?</div>

  <div class="roles">
    {% set icons = {'picker': '📦', 'checker': '🔍', 'purchaser': '🛒', 'delivery': '🚚', 'biller': '🧾', 'packing': '📫', 'other': '⚙️'} %}

    <form method="POST" action="{{ url_for('switch_role') }}">
      <input type="hidden" name="role" value="{{ primary_role }}">
      <button type="submit" class="role-btn" style="width:100%;font-family:inherit;">
        <span class="role-icon">{{ icons.get(primary_role, '👤') }}</span>
        <span class="role-info">
          <div class="role-name">{{ primary_role }}</div>
          <div class="role-tag">Primary Role</div>
        </span>
        <span class="role-arrow">→</span>
      </button>
    </form>

    <form method="POST" action="{{ url_for('switch_role') }}">
      <input type="hidden" name="role" value="{{ secondary_role }}">
      <button type="submit" class="role-btn" style="width:100%;font-family:inherit;border-color:rgba(167,139,250,0.35);">
        <span class="role-icon">{{ icons.get(secondary_role, '👤') }}</span>
        <span class="role-info">
          <div class="role-name">{{ secondary_role }}</div>
          <div class="role-tag">Secondary Role</div>
        </span>
        <span class="role-arrow">→</span>
      </button>
    </form>
  </div>

  <a href="{{ url_for('dashboard') }}" class="skip">Skip — go to dashboard →</a>
</div>
</body>
</html>
