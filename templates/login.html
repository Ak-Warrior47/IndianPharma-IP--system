<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Login | Indian Pharma IP</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#1d4ed8;--blue-l:#3b82f6;--blue-xl:#eff6ff;
  --dark:#0f172a;--gray:#64748b;--lgray:#e2e8f0;--white:#ffffff;
}
body{
  font-family:'Inter',sans-serif;min-height:100vh;display:flex;
  align-items:center;justify-content:center;
  background:#f0f4ff;
  background-image:
    radial-gradient(ellipse at 10% 10%,rgba(29,78,216,.1) 0%,transparent 50%),
    radial-gradient(ellipse at 90% 90%,rgba(96,165,250,.08) 0%,transparent 50%),
    linear-gradient(rgba(29,78,216,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(29,78,216,.025) 1px,transparent 1px);
  background-size:100% 100%,100% 100%,36px 36px,36px 36px;
}
.card{
  width:100%;max-width:420px;margin:1.5rem;
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.9);
  border-radius:24px;
  box-shadow:0 8px 40px rgba(15,23,42,.12),0 2px 8px rgba(15,23,42,.06),inset 0 1px 0 rgba(255,255,255,.8);
  overflow:hidden;
}
.card-top{
  background:linear-gradient(135deg,var(--blue),var(--blue-l));
  padding:2rem 2rem 1.5rem;
  position:relative;overflow:hidden;
}
.card-top::before{content:"";position:absolute;top:-30px;right:-30px;width:140px;height:140px;background:rgba(255,255,255,.07);border-radius:50%}
.card-top::after{content:"";position:absolute;bottom:-50px;left:20px;width:100px;height:100px;background:rgba(255,255,255,.04);border-radius:50%}
.brand-mark{width:48px;height:48px;background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.3);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;margin-bottom:.9rem}
.brand-name{font-size:1.25rem;font-weight:800;color:#fff;letter-spacing:-.5px;margin-bottom:3px}
.brand-sub{font-size:.72rem;color:rgba(255,255,255,.7);font-weight:600;letter-spacing:1px;text-transform:uppercase}

.card-body{padding:1.75rem 2rem 2rem}

/* Flash messages */
.flash-list{list-style:none;margin-bottom:1rem}
.flash-item{padding:10px 14px;border-radius:10px;font-size:.8rem;font-weight:600;display:flex;align-items:center;gap:7px;margin-bottom:6px}
.flash-danger{background:#fff1f2;color:#be123c;border:1px solid #fecdd3}
.flash-warning{background:#fffbeb;color:#b45309;border:1px solid #fde68a}
.flash-success{background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0}
.flash-info{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}

label{display:block;font-size:.72rem;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px;margin-top:1rem}
label:first-of-type{margin-top:0}

/* Email input wrapper */
.email-wrap{position:relative}
.fi{
  width:100%;padding:11px 14px;border-radius:10px;
  border:1.5px solid var(--lgray);
  background:#f8fafc;
  font-size:.9rem;font-family:'Inter',sans-serif;
  color:var(--dark);outline:none;transition:all .2s;
}
.fi:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(29,78,216,.1)}

/* Suggestion dropdown */
.email-suggestion{
  position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:99;
  background:#fff;border:1.5px solid var(--blue);border-radius:10px;
  box-shadow:0 8px 24px rgba(15,23,42,.12);
  overflow:hidden;display:none;
}
.sug-item{
  padding:10px 14px;font-size:.85rem;cursor:pointer;
  display:flex;align-items:center;gap:8px;
  transition:background .15s;
}
.sug-item:hover,.sug-item.active{background:var(--blue-xl)}
.sug-domain{color:var(--blue);font-weight:700}
.sug-label{font-size:.68rem;color:var(--gray);margin-left:auto}

/* Role select */
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:.4rem}
.role-opt{position:relative}
.role-opt input{position:absolute;opacity:0;width:0;height:0}
.role-label{
  display:flex;align-items:center;gap:7px;
  padding:10px 12px;border-radius:10px;
  border:1.5px solid var(--lgray);background:#f8fafc;
  font-size:.8rem;font-weight:700;color:var(--gray);
  cursor:pointer;transition:all .2s;
}
.role-opt input:checked + .role-label{
  border-color:var(--blue);background:var(--blue-xl);color:var(--blue);
}
.role-label i{font-size:.95rem}

.btn-login{
  width:100%;margin-top:1.5rem;padding:13px;
  background:linear-gradient(135deg,var(--blue),var(--blue-l)) !important;
  color:#fff !important;border:none;border-radius:11px;
  font-size:.9rem;font-weight:700;cursor:pointer;
  font-family:'Inter',sans-serif;
  box-shadow:0 4px 16px rgba(29,78,216,.3);
  transition:all .2s;display:flex !important;align-items:center;justify-content:center;gap:7px;
}
.btn-login:hover{background:linear-gradient(135deg,#1e3a8a,#1d4ed8) !important;transform:translateY(-1px);box-shadow:0 6px 20px rgba(29,78,216,.35)}
.btn-login:active{transform:translateY(0)}

.hint{font-size:.7rem;color:var(--gray);text-align:center;margin-top:1rem}
.hint span{color:var(--blue);font-weight:600}
</style>
</head>
<body>
<div class="card">
  <div class="card-top">
    <div class="brand-mark"><i class="ph-fill ph-dna" style="color:#fff"></i></div>
    <div class="brand-name">Indian Pharma IP</div>
    <div class="brand-sub">Operations · KRA System</div>
  </div>
  <div class="card-body">
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <ul class="flash-list">
      {% for cat, msg in messages %}
      <li class="flash-item flash-{{cat}}">
        <i class="ph-bold ph-{% if cat=='danger' %}warning-octagon{% elif cat=='success' %}check-circle{% elif cat=='warning' %}warning{% else %}info{% endif %}"></i>
        {{msg}}
      </li>
      {% endfor %}
    </ul>
    {% endif %}
    {% endwith %}

    <form method="POST" action="/login" autocomplete="off">
      <label for="email">Pharma ID (Email)</label>
      <div class="email-wrap">
        <input
          class="fi" type="text" id="email" name="email"
          placeholder="yourname@pharmaip.com"
          autocomplete="off" spellcheck="false"
          required
        >
        <div class="email-suggestion" id="emailSug">
          <div class="sug-item" id="sugItem">
            <i class="ph-bold ph-envelope" style="color:#1d4ed8;font-size:.85rem"></i>
            <span id="sugFull"></span>
            <span class="sug-label">Press Enter or Tab</span>
          </div>
        </div>
      </div>

      <label for="password">Password</label>
      <input class="fi" type="password" id="password" name="password" placeholder="••••••••" required>

      <label>Your Role</label>
      <div class="role-grid">
        <div class="role-opt">
          <input type="radio" name="staff_type" id="r_picker" value="picker" checked>
          <label class="role-label" for="r_picker">
            <i class="ph-bold ph-package"></i> Picker
          </label>
        </div>
        <div class="role-opt">
          <input type="radio" name="staff_type" id="r_checker" value="checker">
          <label class="role-label" for="r_checker">
            <i class="ph-bold ph-magnifying-glass"></i> Checker
          </label>
        </div>
      </div>

      <button type="submit" class="btn-login">
        <i class="ph-bold ph-sign-in"></i> Sign In
      </button>
    </form>
    <p class="hint">Authorized personnel only · <span>@pharmaip.com</span> accounts</p>
  </div>
</div>

<script>
const emailInput = document.getElementById('email');
const sug        = document.getElementById('emailSug');
const sugFull    = document.getElementById('sugFull');
const sugItem    = document.getElementById('sugItem');
const DOMAIN     = '@pharmaip.com';

function updateSuggestion() {
  const val = emailInput.value.trim();
  if (!val || val.includes('@')) { sug.style.display = 'none'; return; }
  sugFull.innerHTML = val + '<span class="sug-domain">' + DOMAIN + '</span>';
  sug.style.display = 'block';
}

function applySuggestion() {
  const val = emailInput.value.trim();
  if (!val || val.includes('@')) return;
  emailInput.value = val + DOMAIN;
  sug.style.display = 'none';
}

emailInput.addEventListener('input', updateSuggestion);
emailInput.addEventListener('keydown', function(e) {
  if ((e.key === 'Tab' || e.key === 'Enter') && sug.style.display === 'block') {
    e.preventDefault();
    applySuggestion();
    if (e.key === 'Tab') document.getElementById('password').focus();
  }
  if (e.key === 'Escape') sug.style.display = 'none';
});
sugItem.addEventListener('mousedown', function(e) {
  e.preventDefault();
  applySuggestion();
});
document.addEventListener('click', function(e) {
  if (!emailInput.contains(e.target) && !sug.contains(e.target)) {
    sug.style.display = 'none';
  }
});
// If user leaves email field without @, auto-append domain
emailInput.addEventListener('blur', function() {
  setTimeout(() => sug.style.display = 'none', 150);
});
</script>
</body>
</html>
