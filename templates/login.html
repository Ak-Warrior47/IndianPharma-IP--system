<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Access | Indian Pharma IP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #ffffff;
            background-image:
                linear-gradient(rgba(0,0,0,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,0,0,0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-wrapper {
            width: 100%;
            max-width: 420px;
        }

        /* Top brand strip */
        .brand-strip {
            text-align: center;
            margin-bottom: 2rem;
        }

        .brand-mark {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            background: #0f172a;
            color: #ffffff;
            border-radius: 16px;
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        .brand-name {
            font-size: 1.4rem;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -0.5px;
            margin: 0;
        }

        .brand-sub {
            font-size: 0.75rem;
            color: #94a3b8;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 4px;
        }

        /* Card */
        .login-card {
            background: #ffffff;
            border: 1.5px solid #e2e8f0;
            border-radius: 24px;
            padding: 2.5rem 2rem;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
            animation: fadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .form-label {
            font-weight: 700;
            font-size: 0.7rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .input-group-custom {
            position: relative;
            margin-bottom: 1rem;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 1.1rem;
            pointer-events: none;
            z-index: 2;
            transition: color 0.2s;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px 12px 42px;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            background: #f8fafc;
            font-size: 0.95rem;
            font-weight: 500;
            color: #0f172a;
            transition: all 0.2s;
            outline: none;
        }

        .form-input:focus {
            border-color: #0f172a;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(15,23,42,0.06);
        }

        .form-input:focus ~ .input-icon {
            color: #0f172a;
        }

        .toggle-pw {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            padding: 4px;
            line-height: 1;
            z-index: 2;
        }

        .toggle-pw:hover { color: #0f172a; }

        .btn-login {
            width: 100%;
            background: #0f172a;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s;
            cursor: pointer;
            margin-top: 0.5rem;
        }

        .btn-login:hover {
            background: #1e293b;
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(15,23,42,0.2);
        }

        .btn-login:active { transform: translateY(0); }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .alert-error {
            background: #fff1f2;
            border: 1px solid #fecdd3;
            color: #9f1239;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .divider-text {
            text-align: center;
            font-size: 0.7rem;
            color: #94a3b8;
            font-weight: 600;
            letter-spacing: 1.5px;
            margin-top: 1.5rem;
        }

        .help-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 0.5rem 0 1rem;
        }

        .form-check-label {
            font-size: 0.8rem;
            color: #64748b;
            font-weight: 500;
        }

        .form-check-input:checked {
            background-color: #0f172a;
            border-color: #0f172a;
        }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="brand-strip">
        <div class="brand-mark"><i class="ph-fill ph-dna"></i></div>
        <h1 class="brand-name">Indian Pharma IP</h1>
        <p class="brand-sub">Operational Gateway v3.0</p>
    </div>

    <div class="login-card">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                <div class="alert-error">
                    <i class="ph-fill ph-warning-circle"></i> {{ message }}
                </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" id="loginForm">
            <div class="mb-3">
                <label class="form-label">Corporate Email</label>
                <div class="input-group-custom">
                    <input type="email" name="email" class="form-input"
                           placeholder="employee@pharmaip.com" required autofocus>
                    <i class="ph ph-envelope input-icon"></i>
                </div>
            </div>

            <div class="mb-1">
                <label class="form-label">Password</label>
                <div class="input-group-custom">
                    <input type="password" name="password" id="passInput"
                           class="form-input" placeholder="••••••••" required>
                    <i class="ph ph-lock-key input-icon"></i>
                    <button type="button" class="toggle-pw" onclick="togglePw()">
                        <i class="ph ph-eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>

            <div class="help-row">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="remember">
                    <label class="form-check-label" for="remember">Stay signed in</label>
                </div>
            </div>

            <button type="submit" class="btn-login" id="authBtn">
                <span id="btnText">SIGN IN</span>
                <i class="ph-bold ph-arrow-right" id="btnIcon"></i>
            </button>
        </form>
    </div>

    <div class="divider-text mt-3">SECURED · INDIAN PHARMACEUTICALS IP © 2026</div>
</div>

<script>
    function togglePw() {
        const inp = document.getElementById('passInput');
        const ico = document.getElementById('eyeIcon');
        if (inp.type === 'password') {
            inp.type = 'text';
            ico.className = 'ph ph-eye-slash';
        } else {
            inp.type = 'password';
            ico.className = 'ph ph-eye';
        }
    }

    document.getElementById('loginForm').onsubmit = function() {
        const btn = document.getElementById('authBtn');
        btn.disabled = true;
        document.getElementById('btnText').textContent = 'VERIFYING...';
        document.getElementById('btnIcon').className = 'ph ph-circle-notch';
    };
</script>
</body>
</html>
