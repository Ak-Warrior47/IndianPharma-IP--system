<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Secure Access | Indian Pharma IP</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<style>
*{box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#fff;
  background-image:linear-gradient(rgba(0,0,0,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,0.04) 1px,transparent 1px);
  background-size:40px 40px;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.wrap{width:100%;max-width:420px}
.brand{text-align:center;margin-bottom:2rem}
.mark{display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;
  background:#0f172a;color:#fff;border-radius:16px;font-size:1.5rem;margin-bottom:1rem}
.brand h1{font-size:1.4rem;font-weight:800;color:#0f172a;letter-spacing:-0.5px;margin:0}
.brand p{font-size:.7rem;color:#94a3b8;font-weight:600;letter-spacing:2px;text-transform:uppercase;margin-top:4px}
.card{background:#fff;border:1.5px solid #e2e8f0;border-radius:24px;padding:2.5rem 2rem;
  box-shadow:0 4px 24px rgba(0,0,0,.06);animation:fadeUp .5s cubic-bezier(.16,1,.3,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.fl{font-weight:700;font-size:.68rem;color:#64748b;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.ig{position:relative;margin-bottom:1rem}
.ii{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#94a3b8;font-size:1.1rem;pointer-events:none;z-index:2}
.fi{width:100%;padding:12px 16px 12px 42px;border:1.5px solid #e2e8f0;border-radius:12px;
  background:#f8fafc;font-size:.95rem;font-weight:500;color:#0f172a;transition:all .2s;outline:none}
.fi:focus{border-color:#0f172a;background:#fff;box-shadow:0 0 0 4px rgba(15,23,42,.06)}
.tpw{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;
  color:#94a3b8;cursor:pointer;padding:4px;z-index:2}
.tpw:hover{color:#0f172a}
.btn-login{width:100%;background:#0f172a;color:#fff;border:none;border-radius:12px;padding:14px;
  font-weight:700;font-size:.9rem;letter-spacing:.5px;display:flex;align-items:center;
  justify-content:center;gap:10px;transition:all .2s;cursor:pointer;margin-top:.5rem}
.btn-login:hover{background:#1e293b;transform:translateY(-1px);box-shadow:0 8px 20px rgba(15,23,42,.2)}
.btn-login:disabled{opacity:.6;cursor:not-allowed;transform:none}
.err{background:#fff1f2;border:1px solid #fecdd3;color:#9f1239;border-radius:10px;
  padding:10px 14px;font-size:.85rem;font-weight:500;margin-bottom:1.25rem;display:flex;align-items:center;gap:8px}
.hr{display:flex;justify-content:space-between;align-items:center;margin:.5rem 0 1rem}
.form-check-label{font-size:.8rem;color:#64748b;font-weight:500}
.form-check-input:checked{background-color:#0f172a;border-color:#0f172a}
.foot{text-align:center;font-size:.68rem;color:#94a3b8;font-weight:600;letter-spacing:1.5px;margin-top:1rem}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="mark"><i class="ph-fill ph-dna"></i></div>
    <h1>Indian Pharma IP</h1>
    <p>Operational Gateway v4.0</p>
  </div>
  <div class="card">
    {% with messages=get_flashed_messages(with_categories=true) %}{% if messages %}
      {% for cat,msg in messages %}<div class="err"><i class="ph-fill ph-warning-circle"></i>{{msg}}</div>{% endfor %}
    {% endif %}{% endwith %}
    <form method="POST" id="lf">
      <div class="mb-3">
        <label class="fl">Corporate Email</label>
        <div class="ig">
          <input type="email" name="email" class="fi" placeholder="employee@pharmaip.com" required autofocus>
          <i class="ph ph-envelope ii"></i>
        </div>
      </div>
      <div class="mb-1">
        <label class="fl">Password</label>
        <div class="ig">
          <input type="password" name="password" id="pi" class="fi" placeholder="••••••••" required>
          <i class="ph ph-lock-key ii"></i>
          <button type="button" class="tpw" onclick="tp()"><i class="ph ph-eye" id="ei"></i></button>
        </div>
      </div>
      <div class="hr">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="rm">
          <label class="form-check-label" for="rm">Stay signed in</label>
        </div>
      </div>
      <button type="submit" class="btn-login" id="ab">
        <span id="bt">SIGN IN</span><i class="ph-bold ph-arrow-right" id="bi"></i>
      </button>
    </form>
  </div>
  <div class="foot">SECURED · INDIAN PHARMACEUTICALS IP © 2026</div>
</div>
<script>
function tp(){
  const i=document.getElementById('pi'),e=document.getElementById('ei');
  i.type=i.type==='password'?'text':'password';
  e.className=i.type==='text'?'ph ph-eye-slash':'ph ph-eye';
}
document.getElementById('lf').onsubmit=function(){
  const b=document.getElementById('ab');
  b.disabled=true;document.getElementById('bt').textContent='VERIFYING...';
};
</script>
</body></html>
