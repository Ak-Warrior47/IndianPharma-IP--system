# Render deployment for the Indian Pharma IP System.
#
# Every environment variable the application reads is declared here. The ones
# marked `sync: false` are NOT stored in this file -- Render shows them in the
# service's Environment tab for you to fill in, and keeps secrets out of the
# repository. Previously only four were declared, so the rest were simply absent
# in production and the features that depend on them failed silently: no monthly
# report email, no SMS alerts, and the delivery geofence switched off.
#
# After deploying, open /admin/diagnostics as an admin. It lists exactly which
# of these are set and what each one controls.
#
# NOTE: there is deliberately no `databases:` block. This project uses Supabase.
# DATABASE_URL must point at the Supabase Postgres instance and nothing here
# should ever provision a Render-managed database.

services:
  - type: web
    name: indianpharma-ip-system
    env: python
    buildCommand: pip install -r requirements.txt
    # One worker on purpose: APScheduler runs in-process, so a second worker
    # would fire the monthly report job twice and send duplicate email.
    startCommand: gunicorn -k eventlet -w 1 app:app --bind 0.0.0.0:$PORT --timeout 120
    # Free plan has a monthly allowance of build minutes: rebuild only when
    # something the live app runs has changed. Changes to tests, notes and
    # the blueprint do not start a deploy.
    buildFilter:
      paths:
        - app.py
        - utils.py
        - webpush.py
        - picking_pdf.py
        - requirements.txt
        - render.yaml
        - templates/**
        - static/**
    envVars:
      # ---- Core ----------------------------------------------------------
      - key: SECRET_KEY
        generateValue: true          # without it, every restart logs everyone out
      - key: RENDER
        value: "true"
      - key: PORT
        value: "10000"
      # runtime.txt used to pin python-3.11.6. Render retires old patch releases,
      # and when that exact build is gone it falls back to a newer Python -- at
      # which point the old Pillow==10.1.0 pin had no wheel and the build failed
      # with "Getting requirements to build wheel did not run successfully",
      # even though nothing in the repository had changed. The pin is removed and
      # requirements.txt now installs cleanly on 3.11, 3.12 and 3.13, so any
      # Render default works. Set this only if you need a specific version, and
      # check Render's currently supported list before you do.
      # - key: PYTHON_VERSION
      #   value: "3.13.4"
      # Supabase Postgres connection string. Set in the Environment tab.
      # postgresql://postgres:<password>@db.<project>.supabase.co:5432/postgres
      - key: DATABASE_URL
        sync: false
      # Admin login. Without this the seeded admin password stays "admin123".
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false

      # ---- Email: monthly KPI report ------------------------------------
      # For Gmail use smtp.gmail.com / 587 and a Google App Password, not the
      # account password. Without all four the report cannot send.
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USE_TLS
        value: "true"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      # Where the monthly report is delivered. Named REPORT_EMAIL_TO so it is
      # not confused with ADMIN_EMAIL above, which is the admin's LOGIN account.
      # The old ADMIN_EMAIL_RECIPIENT is still read as a fallback, so an
      # existing deployment keeps working until it is switched over.
      - key: REPORT_EMAIL_TO
        sync: false
      # Render BLOCKS outbound SMTP on free web services (ports 25, 465, 587),
      # so no MAIL_* settings can work there however correct they are. Set one
      # of these API keys to send over HTTPS instead, which is not blocked.
      # Brevo is 300 emails/day free; Resend is 3000/month free. Only one is
      # needed; the SMTP settings below are the fallback for a paid instance.
      - key: BREVO_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_PROVIDER        # auto | brevo | resend | smtp
        value: "auto"
      - key: EMAIL_FROM            # verified sender address for the API
        sync: false
      # Seconds to wait on the SMTP socket. Flask-Mail sets no timeout, so a
      # wrong host or a blocked port would hang the worker until gunicorn
      # killed the request.
      - key: MAIL_TIMEOUT
        value: "15"

      # ---- Delivery ------------------------------------------------------
      # The store's coordinates. While these are unset the geofence is OFF and a
      # rider can start a trip from anywhere, which is why trip start appeared to
      # "work" from outside the warehouse.
      - key: STORE_LAT
        sync: false
      - key: STORE_LNG
        sync: false
      - key: TOMTOM_API_KEY
        sync: false

      # ---- SMS alerts (optional) -----------------------------------------
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: ADMIN_PHONE
        sync: false

      # ---- Scoring targets ------------------------------------------------
      # Items per hour. Defaults are 50 and 70, which are higher than this
      # warehouse has ever achieved, so those scoring components were
      # unreachable. Run tools_recommend_targets.py against the live database to
      # get values derived from real history.
      - key: PICKER_TARGET_HR
        sync: false
      - key: CHECKER_TARGET_HR
        sync: false
      # How much an urgent bill is worth against a normal one when volume is
      # scored. 1.5 means one urgent bill counts as one and a half normal ones.
      # Raise it if urgent work is being avoided; 1.0 switches the weighting off.
      - key: URGENT_BILL_WEIGHT
        value: "1.5"
      # Trial copies only: "1" creates test accounts and shows a "trial" banner,
      # and only when DATABASE_URL is empty. Keep "0" on the live service.
      - key: TRIAL_DEMO
        value: "0"
      # Phone alerts (Web Push). Optional: if left empty the app makes its own
      # key pair once and keeps it in the database.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false

      # ---- Privacy -------------------------------------------------------
      # Location is the most sensitive data this app holds. Points are recorded
      # only while a trip is running, thinned at capture, and deleted on a
      # schedule. Staff are shown exactly these figures on their My Data page,
      # so if you change them the wording they see changes with it.
      - key: GPS_RETENTION_DAYS      # delete location trails after this many days
        value: "30"
      - key: GPS_MIN_SECONDS         # ignore a fix sooner than this after the last
        value: "25"
      - key: GPS_MIN_METRES          # ignore a fix closer than this to the last
        value: "40"
      - key: GPS_MAX_POINTS          # hard cap per trip
        value: "1200"
