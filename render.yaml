services:
  - type: web
    name: indianpharma-ip-system
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -k eventlet -w 1 app:app --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: indianpharma-db
          property: connectionString
      - key: RENDER
        value: "true"
      - key: PORT
        value: "10000"

databases:
  - name: indianpharma-db
    databaseName: indianpharma
    user: indianpharma
    plan: free
