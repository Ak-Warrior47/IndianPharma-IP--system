services:
  - type: web
    name: indianpharma-ip-system
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -k eventlet -w 1 app:app --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: RENDER
        value: "true"
      - key: PORT
        value: "10000"
      # DATABASE_URL points to your Supabase Postgres.
      # Set it in the Render dashboard (Environment tab) — not stored in this file.
      # Format: postgresql://postgres:<password>@db.<project>.supabase.co:5432/postgres
      - key: DATABASE_URL
        sync: false
